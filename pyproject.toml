[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arin-log"
version = "0.2.0"
description = "A lightweight logging package for long-running pipelines: a virtual assistant for the user, a clean archive for the developer."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Marcus Aurelius", email = "marcus.aurelius.hu@gmail.com" }
]
keywords = ["logging", "pipeline", "console", "logger", "arin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Logging",
]

[project.urls]
Homepage = "https://github.com/marcus-aurelius-hu/arin_log"
Source = "https://github.com/marcus-aurelius-hu/arin_log"
Issues = "https://github.com/marcus-aurelius-hu/arin_log/issues"

[tool.setuptools]
packages = ["arin_log"]

[tool.setuptools.package-data]
arin_log = ["log_cnfg.json"]